name: CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/cd.yml'
      - 'scripts/deploy-api.sh'

concurrency:
  group: nearbook-api-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-deploy-api:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          DEPLOY_REVISION: ${{ github.sha }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_IMAGE,DEPLOY_REVISION
          script: |
            set -eu
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            docker pull "$DEPLOY_IMAGE"
            release_dir=$(mktemp -d)
            extract=$(docker create "$DEPLOY_IMAGE")
            trap 'docker rm "$extract" >/dev/null 2>&1 || true; rm -rf "$release_dir"' EXIT
            mkdir -p "$release_dir/scripts" "$release_dir/apps/api/scripts"
            docker cp "$extract:/app/scripts/deploy-api.sh" "$release_dir/scripts/deploy-api.sh"
            docker cp "$extract:/app/apps/api/scripts/check-readiness.cjs" "$release_dir/apps/api/scripts/check-readiness.cjs"
            bash "$release_dir/scripts/deploy-api.sh" "$DEPLOY_IMAGE" "$DEPLOY_REVISION" "$HOME/nearbook/apps/api/.env"
