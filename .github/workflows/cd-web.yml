name: CD Web

# Deploy apps/web to jack-server via a self-hosted runner that lives ON jack-server
# (service: actions.runner.chonghg22-nearbook.jack-nearbook, labels: self-hosted + nearbook).
#
# The web image must be built ON the server: build-time prerendering reaches the API
# at 127.0.0.1:3001, which only exists on jack-server. So the job does NOT build in a
# cloud runner — it runs the server-local scripts/deploy-web.sh against ~/project/nearbook
# (build -> swap compose image -> health check -> smoke). No secrets needed: the runner
# already has filesystem/docker access as the jack user.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/cd-web.yml'
  workflow_dispatch: {}

concurrency:
  group: nearbook-web-production
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Build & deploy web on jack-server
    runs-on: [self-hosted, nearbook]
    steps:
      - name: Deploy main via server-local script
        run: |
          set -eu
          cd "$HOME/project/nearbook"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          scripts/deploy-web.sh
