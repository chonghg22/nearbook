name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Deployment failure and probe contracts
        run: |
          bash -n scripts/deploy-api.sh
          python3 scripts/test-deploy-api.py
          node --test apps/api/scripts/check-readiness.test.cjs

      - name: Type Check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      # turbo test는 ^build에 의존하므로 Build 다음에 두어 캐시를 재사용한다.
      - name: Test
        run: pnpm test

      - name: Install isolated E2E browser
        run: pnpm --filter @nearbook/web exec playwright install --with-deps chromium

      - name: Core browser E2E (local fixture services only)
        run: pnpm --filter @nearbook/web test:e2e

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-e2e-failure-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
